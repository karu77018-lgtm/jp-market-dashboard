<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>JP Market</title>
<style>
:root{--bg:#f4f3ef;--card:#fbfaf7;--line:#e3e1db;--ink:#1c1b19;--sub:#6f6c62;--up:#23824d;--dn:#b5523f;--warn:#8a7b3c;--acc:#3774d3}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.55 -apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;-webkit-text-size-adjust:100%}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 12px 0}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.top h1{font-size:17px;margin:0;letter-spacing:.02em}
.top small{color:var(--sub);font-size:12px}
nav{display:flex;gap:4px;overflow-x:auto;margin-top:8px}
nav button{flex:0 0 auto;border:0;background:none;padding:8px 12px;font:inherit;font-weight:700;color:var(--sub);border-bottom:3px solid transparent}
nav button.on{color:var(--ink);border-bottom-color:var(--up)}
main{max-width:760px;margin:0 auto;padding:10px 10px 40px}
section{display:none}section.on{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin:10px 0}
.card h2{font-size:15px;margin:0 0 6px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.card h2 span{font-size:12px;color:var(--sub);font-weight:600}
details.x{margin:4px 0 8px}details.x summary{font-size:12px;color:var(--sub);cursor:pointer}
details.x div{font-size:12px;color:#4d4a40;margin-top:4px}
.bar{border-radius:9px;padding:9px 11px;font-size:13px;margin:4px 0}
.bar.on{background:#e3f1e8;color:#17603a}.bar.off{background:#f6e3de;color:#8d3626}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.kpi{border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:#fff}
.kpi b{display:block;font-size:20px;font-variant-numeric:tabular-nums}
.kpi span{font-size:11px;color:var(--sub)}
.kpi i{font-style:normal;font-size:12px}
.up{color:var(--up)}.dn{color:var(--dn)}.mut{color:var(--sub)}
table{width:100%;border-collapse:collapse;font-size:12.5px;font-variant-numeric:tabular-nums}
th{font-size:11px;color:var(--sub);font-weight:600;text-align:right;padding:4px 4px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:6px 4px;border-bottom:1px solid #eeece6;text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left;white-space:normal;min-width:6.5em}
table.tight{font-size:12px}table.tight td,table.tight th{padding:6px 3px}
.wrap{overflow-x:auto}
.st{font-size:11px;border-radius:5px;padding:1px 6px;color:#fff;margin-left:4px}
.st.ok{background:var(--up)}.st.hot{background:var(--dn)}.st.watch{background:var(--warn)}
.row{border:1px solid var(--line);border-left:4px solid var(--up);border-radius:10px;padding:9px 10px;margin:7px 0;background:#fff}
.row.wait{border-left-color:#c9c5b8}.row.late{border-left-color:#7aa37d}.row.w{border-left-color:var(--warn)}
.row .h{display:flex;justify-content:space-between;gap:6px;font-weight:700}
.row .m{font-size:12px;color:#4d4a40;margin-top:3px;overflow-wrap:anywhere}
.chip{display:inline-block;font-size:11px;border-radius:999px;padding:1px 8px;background:#e6e4dd;margin:3px 4px 0 0}
.chip.g{background:#e3f1e8;color:#17603a}.chip.r{background:#f6e3de;color:#8d3626}
.sec{font-weight:800;font-size:13px;margin:14px 0 4px}
.sec small{font-weight:600;color:var(--sub);margin-left:6px}
svg{display:block;width:100%;height:auto}
.note{font-size:11px;color:var(--sub);margin-top:16px}
.empty{font-size:13px;color:var(--sub);padding:6px 2px}
</style>
</head>
<body>
<header>
  <div class="top"><h1>JP Market</h1><small id="asof">読み込み中…</small></div>
  <nav id="nav">
    <button data-t="mkt" class="on">地合い</button>
    <button data-t="theme">テーマ</button>
    <button data-t="sec">業種</button>
    <button data-t="swing">スイング候補</button>
    <button data-t="lead">リーダー</button>
  </nav>
</header>
<main>
<section id="mkt" class="on"></section>
<section id="theme"></section>
<section id="sec"></section>
<section id="swing"></section>
<section id="lead"></section>
<p class="note">自分用の分析メモ。売買の推奨ではありません。データは日足（引け後更新）。</p>
</main>
<script>
const $=s=>document.querySelector(s);
const P=(v,d=1)=>v==null?'—':((v>0?'+':'')+(v*100).toFixed(d)+'%');
const R=(v,d=0)=>v==null?'—':(v*100).toFixed(d)+'%';
const Y=v=>v==null?'—':Number(v).toLocaleString('ja-JP',{maximumFractionDigits:v<1000?1:0});
const cls=v=>v==null?'':(v>0?'up':v<0?'dn':'');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let D;
document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('#nav button').forEach(x=>x.classList.toggle('on',x===b));
  document.querySelectorAll('main section').forEach(s=>s.classList.toggle('on',s.id===b.dataset.t));
  try{localStorage.setItem('jpTab',b.dataset.t)}catch(e){}
});
const nm=t=>{const n=D.names[t];return `<b>${esc(t.replace('.T',''))}</b> ${esc(n?n.name:'')}`};
const sub=t=>{const n=D.names[t];return n?`${esc(n.s33)}・${{P:'プライム',S:'スタンダード',G:'グロース'}[n.m]||''}`:''};

function spark(arr,{h=60,color='#23824d',fmt=v=>v,ref=null}={}){
  const v=arr.filter(x=>x!=null);if(v.length<2)return '';
  const w=300,lo=Math.min(...v,ref??Infinity),hi=Math.max(...v,ref??-Infinity),sp=(hi-lo)||1;
  const pts=arr.map((x,i)=>x==null?null:[i/(arr.length-1)*w,h-4-(x-lo)/sp*(h-8)]).filter(Boolean);
  const r=ref==null?'':`<line x1="0" x2="${w}" y1="${h-4-(ref-lo)/sp*(h-8)}" y2="${h-4-(ref-lo)/sp*(h-8)}" stroke="#c9c5b8" stroke-dasharray="3 3"/>`;
  return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">${r}<polyline fill="none" stroke="${color}" stroke-width="2" points="${pts.map(p=>p.map(n=>n.toFixed(1)).join(',')).join(' ')}"/></svg>
  <div style="display:flex;justify-content:space-between;font-size:11px;color:#6f6c62"><span>${fmt(v[0])}</span><span>120日</span><span>${fmt(v[v.length-1])}</span></div>`;
}

function line(series,{h=120,colors=['#1c1b19','#3774d3','#8a7b3c'],ref=null,refLabel='',fmt=v=>v,dates=null,shade=null}={}){
  const all=series.flat().filter(x=>x!=null).concat(ref==null?[]:[ref]);if(all.length<2)return '';
  const w=300,lo=Math.min(...all),hi=Math.max(...all),sp=(hi-lo)||1,n=series[0].length;
  const X=i=>i/(n-1)*w,Yv=x=>h-4-(x-lo)/sp*(h-8);
  let g='';
  if(shade)shade.forEach((on,i)=>{if(on)g+=`<rect x="${(X(i)-w/(n-1)/2).toFixed(1)}" y="0" width="${(w/(n-1)+.4).toFixed(1)}" height="${h}" fill="#f6e3de"/>`});
  if(ref!=null)g+=`<line x1="0" x2="${w}" y1="${Yv(ref).toFixed(1)}" y2="${Yv(ref).toFixed(1)}" stroke="#b5523f" stroke-dasharray="4 3"/>`;
  series.forEach((arr,k)=>{const pts=arr.map((x,i)=>x==null?null:`${X(i).toFixed(1)},${Yv(x).toFixed(1)}`).filter(Boolean).join(' ');
    g+=`<polyline fill="none" stroke="${colors[k]}" stroke-width="${k?1.4:2}" points="${pts}"/>`});
  const d=dates||[];
  return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">${g}</svg>
  <div style="display:flex;justify-content:space-between;font-size:11px;color:#6f6c62"><span>${d[0]||''}</span><span>${refLabel}</span><span>${fmt(series[0][n-1])}</span></div>`;
}
const S1=x=>x&&x.n?`<span class="${cls(x.avg)}">${P(x.avg)}</span><br><span class="mut" style="font-size:11px">勝率${R(x.win)}・${x.n}件</span>`:'—';
const PER=['2003-2007','2008-2012','2013-2017','2018-2026'];
function perTable(rows){ // rows: [label, statsByPeriod]
  return `<div class="wrap"><table class="tight"><tr><th>条件</th><th>全期間</th>${PER.map(p=>`<th>${p.slice(2,4)}〜${p.slice(7)}</th>`).join('')}</tr>
  ${rows.map(([l,o])=>`<tr><td>${l}</td><td>${S1(o.all)}</td>${PER.map(p=>`<td>${S1(o[p])}</td>`).join('')}</tr>`).join('')}</table></div>`;
}

function renderMkt(){
  const g=D.regime, b=D.breadth, H=D.breadth_hist, U=D.pulse, ST=U.stats||{}, RH=D.regime_hist;
  const mc={panic:'off',wash:'on',bear:'off',normal:''}[U.mode.key];
  const z=(ST.breadth_zones||{})[U.zone]||{}, zall=(ST.breadth_zones||{})['全期間']||{};
  const reg=(ST.regime||{})[g.vs200>0?'above':'below']||{};
  const refs=D.refs.map(r=>`<tr><td>${esc(r.name)}</td><td>${Y(r.close)}</td><td class="${cls(r.chg)}">${P(r.chg)}</td><td class="${cls(r.r5)}">${P(r.r5)}</td><td class="${cls(r.r21)}">${P(r.r21)}</td><td class="${cls(r.vs200)}">${P(r.vs200)}</td><td>${P(r.from_high)}</td></tr>`).join('');
  const bnf=ST.bnf||{}, wash=ST.washout||{}, q=ST.quiet||{}, fl=ST.sector_flow||{}, pdd=ST.panic_days||{};
  const qrows=q.by_period?Object.entries(q.by_period).map(([k,o])=>`<tr><td>${k.replace('-','〜')}</td><td class="${cls(o.cagr)}">${P(o.cagr)}</td><td class="${cls(o.cagr_bench)}">${P(o.cagr_bench)}</td><td>${P(o.dd,0)}</td><td>${P(o.dd_bench,0)}</td><td>${R(o.month_win_vs_bench)}</td></tr>`).join(''):'';
  const W=U.wash;
  const mrow=k=>{const x=b[k];return `<tr><td>${k==='all'?'全体':x.name}</td><td>${x.n}</td><td>${R(x.a50)}</td><td>${R(x.a200)}</td><td class="up">${x.nh}</td><td class="dn">${x.nl}</td><td>${x.tt}<br><span class="mut" style="font-size:11px">${R(x.tt_rate,1)}</span></td></tr>`};
  const washTxt=W.active?`点灯中：サイン ${W.last_signal}、20日の検証期間はあと${W.left}日`
    :W.armed?`待機：直近10日の最低 ${R(W.a50_min10,1)}（20%未満）。${R(W.need,1)}以上に戻ればサイン`
    :`なし：直近10日の最低 ${R(W.a50_min10,1)}（20%未満で待機に入る）。前回のサイン ${W.last_signal||'—'}`;
  $('#mkt').innerHTML=`
  <div class="card"><h2>今日の判定<span>${D.session}</span></h2>
    <div class="bar ${mc}"><b>${esc(U.mode.label)}</b>　${esc(U.mode.text)}</div>
    <details class="x"><summary>読み方</summary><div>日本株の2003〜2026年の検証で効いた条件だけを使った「今日の状態」。売買の推奨ではない。検証は現在上場している銘柄だけで計算（上場廃止銘柄を含まない）ため、個別株の数字は良く出やすい。米国式の順張り（ブレイク・初押し・高値更新）は日本株では効かなかったので使っていない。</div></details>
    <div class="grid">
      <div class="kpi"><span>50日線より上（流動性上位${U.liquid_n}）</span><b>${R(U.a50,1)}</b><i class="mut">5日前 ${R(U.a50_5ago,1)}・1か月前 ${R(U.a50_21ago,1)}</i></div>
      <div class="kpi"><span>25日線から−20%以下の割合</span><b class="${U.panic_today?'dn':''}">${R(U.panic_share,1)}</b><i class="mut">5%以上で全面安の日。直近20日で${U.panic_days_20}日</i></div>
      <div class="kpi"><span>日経平均 52週高値から</span><b class="${U.bear?'dn':''}">${P(U.n225_from_high)}</b><i class="mut">−20%超で弱気相場</i></div>
    </div>
    <div class="m" style="font-size:12px;margin-top:8px">今の水準（50日線より上が${U.zone}）だった日の、TOPIX連動ETFのその後20日：平均${P((z.h20||{}).avg)}・上昇${R((z.h20||{}).win)}（全期間平均${P((zall.h20||{}).avg)}・${R((zall.h20||{}).win)}、2003年〜）</div>
  </div>
  <div class="card"><h2>指数<span>日次・週次・月次</span></h2>
    <div class="wrap"><table class="tight"><tr><th>指数</th><th>終値</th><th>1日</th><th>5日</th><th>1か月</th><th>200日線</th><th>高値から</th></tr>${refs}</table></div>
    ${RH?`<div class="sec">TOPIX連動ETFと50日線・200日線<small>120日</small></div>${line([RH.close,RH.ma50,RH.ma200],{dates:RH.dates,refLabel:'黒=終値 青=50日線 茶=200日線',fmt:Y})}`:''}
    <div class="m" style="font-size:12px;margin-top:6px">200日線の${g.vs200>0?'上':'下'}にあった日の、その後60日：平均${P((reg.h60||{}).avg)}・上昇${R((reg.h60||{}).win)}（2003年〜）。上と下で差は小さく、日本株では200日線だけで新規を止める根拠は弱い。</div>
  </div>
  <div class="card"><h2>全面安（25日線から−20%以下）<span>${U.bnf_count}銘柄</span></h2>
    <details class="x"><summary>読み方</summary><div>${esc(bnf.rule||'')}。${esc(bnf.note||'')}。同じ買い方でも、全面安の日だけに絞ると成績が大きく違う。直近の全面安の日：${(U.panic_recent||[]).slice(-8).join('、')}。</div></details>
    ${line([U.hist.panic],{dates:U.hist.dates,ref:0.05,refLabel:'赤線=5%',fmt:v=>R(v,1),shade:U.hist.panic.map(x=>x>=0.05)})}
    ${perTable([['全面安の日',bnf.panic||{}],['それ以外の日',bnf.alone||{}]])}
    <div class="m" style="font-size:12px">1回あたりの平均（手仕舞いまで平均${bnf.panic_hold_days??'—'}日）。全面安の日のTOPIX連動ETF：その後20日 平均${P(((pdd.topix_fwd||{}).h20||{}).avg)}・上昇${R(((pdd.topix_fwd||{}).h20||{}).win)}（${pdd.count??'—'}日）。</div>
    <div class="sec">今日 −20%以下の流動性上位銘柄<small>乖離の大きい順・最大15</small></div>
    <div class="wrap"><table class="tight"><tr><th>銘柄</th><th>25日線から</th><th>終値</th><th>25日線</th><th>1日</th></tr>
    ${U.bnf.map(r=>`<tr><td>${nm(r.t)}<div class="mut" style="font-size:11px">${sub(r.t)}</div></td><td class="dn">${P(r.dev)}</td><td>${Y(r.close)}</td><td>${Y(r.ma25)}</td><td class="${cls(r.chg)}">${P(r.chg)}</td></tr>`).join('')||'<tr><td colspan="5" class="empty">なし</td></tr>'}</table></div>
  </div>
  <div class="card"><h2>反発サイン<span>50日線より上の割合</span></h2>
    <div class="bar ${W.active?'on':''}">${washTxt}</div>
    <details class="x"><summary>読み方</summary><div>${esc(wash.rule||'')}。${esc(wash.note||'')}。下は、サイン翌日から20日間持った場合の1回あたりの成績。直近のサイン：${(wash.dates||[]).join('、')}。</div></details>
    ${line([U.hist.a50],{dates:U.hist.dates,ref:0.2,refLabel:'赤線=20%',fmt:v=>R(v,1)})}
    ${perTable([['TOPIX連動ETF',wash.topix_1x||{}],['日経平均2倍',wash.nikkei_2x||{}],['弱気相場中（除外）',wash.bear_skipped||{}]])}
  </div>
  <div class="card"><h2>値動きの小さい大型株<span>${U.quiet.length}銘柄</span></h2>
    <details class="x"><summary>読み方</summary><div>${esc(q.rule||'')}。比較はTOPIX連動ETF。月次勝率＝TOPIX連動ETFを上回った月の割合。2013〜2017年の上げ相場では下回った。強いのは下げ相場で崩れにくいこと。</div></details>
    <div class="wrap"><table class="tight"><tr><th>期間</th><th>年率</th><th>TOPIX</th><th>最大下落</th><th>TOPIX</th><th>月次勝率</th></tr>${qrows}</table></div>
    <div class="sec">今日の条件に当てはまる20銘柄<small>値動きの小さい順</small></div>
    <div class="wrap"><table class="tight"><tr><th>銘柄</th><th>60日の値動き(年率)</th><th>高値比</th><th>1か月</th></tr>
    ${U.quiet.map(r=>`<tr><td>${nm(r.t)}<div class="mut" style="font-size:11px">${sub(r.t)}</div></td><td>${R(r.vol,1)}</td><td>${R(r.near)}</td><td class="${cls(r.r21)}">${P(r.r21)}</td></tr>`).join('')}</table></div>
  </div>
  <div class="card"><h2>業種の資金の流れ<span>33業種・RS21−RS189</span></h2>
    <details class="x"><summary>読み方</summary><div>${esc(fl.rule||'')}。プラス＝最近1か月の強さが長期の強さより上（資金が入ってきている）。ただし過去検証では、月末の上位5業種と下位5業種のその後21日の差は平均${P(((fl.spread_21d||{}).all||{}).avg,2)}（上位が勝った月${R(((fl.spread_21d||{}).all||{}).win)}）で、この順位だけで次の1か月は予測できなかった。今どこに資金が動いているかを見る計器として使う。</div></details>
    <div class="wrap"><table class="tight"><tr><th>業種</th><th>流入</th><th>5日前</th><th>RS21</th><th>RS189</th><th>1日</th><th>5日</th><th>1か月</th></tr>
    ${U.flow.map(r=>`<tr><td>${esc(r.name)}<div class="mut" style="font-size:11px">${r.n}銘柄</div></td><td class="${cls(r.flow)}"><b>${r.flow>0?'+':''}${r.flow}</b></td><td class="mut">${r.flow_5ago>0?'+':''}${r.flow_5ago}</td><td>${r.rs21}</td><td>${r.rs189}</td><td class="${cls(r.chg)}">${P(r.chg)}</td><td class="${cls(r.r5)}">${P(r.r5)}</td><td class="${cls(r.r21)}">${P(r.r21)}</td></tr>`).join('')}</table></div>
  </div>
  <div class="card"><h2>市場の広がり<span>内国株・上場1年以上</span></h2>
    <details class="x"><summary>読み方</summary><div>50日線・200日線の上にいる銘柄の割合、52週の新高値・新安値の数、トレンドテンプレート8条件をすべて満たした銘柄数（RSは全銘柄内の順位）。</div></details>
    <div class="wrap"><table class="tight"><tr><th>市場</th><th>銘柄</th><th>50日線上</th><th>200日線上</th><th>新高値</th><th>新安値</th><th>TT通過</th></tr>
    ${['all','P','S','G'].map(mrow).join('')}</table></div>
    <div class="sec">50日線より上の割合</div>${spark(H.a50,{fmt:v=>R(v),ref:0.5})}
    <div class="sec">TT通過数（RS条件を除く7条件）</div>${spark(H.tt7,{color:'#3774d3'})}
    <div class="sec">新高値 − 新安値</div>${spark(H.nh.map((x,i)=>x-H.nl[i]),{color:'#8a7b3c',ref:0})}
  </div>`;
}

function renderSec(){
  const S=D.sectors, gate=S.filter(s=>s.status);
  const badge=s=>s.status?`<span class="st ${{合格:'ok',過熱:'hot',監視:'watch'}[s.status]}">${s.status}</span>`:'';
  const mv=s=>{const d=s.rank_then-s.rank;return d>0?`<span class="up">▲${d}</span>`:d<0?`<span class="dn">▼${-d}</span>`:'<span class="mut">・</span>'};
  const gateHtml=gate.length?gate.map(s=>`<div class="row ${s.status==='合格'?'':'w'}"><div class="h"><span>${esc(s.name)}${badge(s)}</span><span class="${cls(s.r63)}">3か月 ${P(s.r63)}</span></div>
    <div class="m">高値から ${P(s.from_high)}・200日線 ${P(s.ext200)}・主導株 ${s.leaders}/${s.n}（${s.lead.map(t=>esc(t.replace('.T',''))).join(' ')}）</div>
    ${s.status==='合格'?`<div class="m">押し目候補（2番手以降）：${s.cands.length?s.cands.map(c=>`${nm(c.t)}（RS${c.rs}・高値${P(c.off,0)}）`).join(' / '):'条件に合う押し目なし（待つ）'}</div>`
      :s.status==='過熱'?'<div class="m">200日線から+150%超。新規は見送り。</div>':'<div class="m">着火待ち（3か月+30%かつ52週高値圏で合格）。</div>'}</div>`).join('')
    :'<div class="empty">合格・監視の業種なし。</div>';
  $('#sec').innerHTML=`
  <div class="card"><h2>業種判定（3条件）<span>東証33業種</span></h2>
    <details class="x"><summary>読み方</summary><div>米国版テーマ判定と同じ3条件を33業種の等ウェイト指数に当てはめたもの。①着火＝52週高値の3%以内かつ3か月+30%以上、②広がり＝RS85以上かつ200日線上の主導株が3銘柄以上、③過熱でない＝200日線から+150%以内。33業種は米国の細分テーマより粗いので、合格はかなり出にくい。日本株での検証はまだ。対象は50日平均売買代金1億円以上。</div></details>
    ${gateHtml}</div>
  <div class="card"><h2>業種ローテーション<span>3か月リターン順</span></h2>
    <details class="x"><summary>読み方</summary><div>順位の矢印は「1か月前の時点の3か月リターン順位」からの変化。TT率＝業種内でトレンドテンプレート8条件を通過した割合。${D.sectors_skipped.length?`対象銘柄が5未満のため除外：${D.sectors_skipped.map(esc).join('・')}。`:''}</div></details>
    <div class="wrap"><table class="tight"><tr><th>業種</th><th>順位</th><th>1か月</th><th>3か月</th><th>高値から</th><th>50日線上</th><th>TT率</th></tr>
    ${S.map(s=>`<tr><td>${esc(s.name)}${badge(s)}</td><td>${s.rank}&nbsp;${mv(s)}</td><td class="${cls(s.r21)}">${P(s.r21)}</td><td class="${cls(s.r63)}">${P(s.r63)}</td><td>${P(s.from_high)}</td><td>${R(s.a50)}</td><td>${R(s.tt_rate)}</td></tr>`).join('')}
    </table></div></div>`;
}


function renderTheme(){
  const T=D.theme; if(!T){$('#theme').innerHTML='<div class="card"><div class="empty">テーマデータなし</div></div>';return;}
  const badge=s=>s.status?`<span class="st ${{合格:'ok',過熱:'hot',監視:'watch'}[s.status]}">${s.status}</span>`:'';
  const mv=s=>{const d=s.rank_then-s.rank;return d>0?`<span class="up">▲${d}</span>`:d<0?`<span class="dn">▼${-d}</span>`:'<span class="mut">・</span>'};
  const code=t=>esc(t.replace('.T',''));
  const short=t=>{const n=D.names[t];return `${code(t)} ${esc(n?n.name:'')}`};
  const glabel=g=>g.label?esc(g.label):`連動群：${g.core.slice(0,2).map(t=>esc((D.names[t]||{}).name||code(t))).join('・')}など`;
  const gate=[...T.themes.filter(x=>x.status).map(x=>({...x,kind:'テーマ',title:esc(x.name),mem:x.top})),
              ...T.groups.filter(x=>x.status&&x.n>=5).map(x=>({...x,kind:'連動群',title:glabel(x),mem:x.members.slice(0,5)}))];
  const order={合格:0,監視:1,過熱:2}; gate.sort((a,b)=>order[a.status]-order[b.status]||(b.r63-a.r63));
  const gateHtml=gate.length?gate.map(x=>`<div class="row ${x.status==='合格'?'':'w'}"><div class="h"><span>${x.title}${badge(x)}<span class="chip">${x.kind}</span></span><span class="${cls(x.r63)}">3か月 ${P(x.r63)}</span></div>
    <div class="m">高値から ${P(x.from_high)}・200日線 ${P(x.ext200)}・主導株 ${x.leaders}/${x.n}</div>
    <div class="m">${x.mem.map(short).join(' / ')}</div></div>`).join(''):'<div class="empty">合格・監視のテーマなし</div>';
  const cands=T.cands.map(r=>{const g=T.groups.find(g=>g.id===r.gid);const th=[...new Set(r.themes)];
    const gl=g?(g.label&&th.includes(g.label)?'':`連動：${g.label?esc(g.label):g.core.filter(t=>t!==r.t).slice(0,2).map(t=>esc((D.names[t]||{}).name||code(t))).join('・')+'など'}`):'';
    const sub=[th.map(esc).join('・'),gl].filter(Boolean).join('／');
    return `<tr><td>${nm(r.t)}<div class="mut" style="font-size:11px">${sub}</div></td><td>${r.rs??'—'}</td><td>${R(r.near)}</td><td class="${cls(r.r126)}">${P(r.r126,0)}</td></tr>`}).join('');
  const lone=T.lone.slice(0,12).map(r=>short(r.t)).join(' / ');
  const majors=[...new Set(T.themes.map(x=>x.major))];
  const rot=T.themes.map(x=>`<tr><td>${esc(x.name)}${badge(x)}<div class="mut" style="font-size:11px">${esc(x.major)}・${x.n}銘柄</div></td><td>${x.rank}&nbsp;${mv(x)}</td><td class="${cls(x.r21)}">${P(x.r21)}</td><td class="${cls(x.r63)}">${P(x.r63)}</td><td>${P(x.from_high)}</td><td>${x.leaders}</td></tr>`).join('');
  const grp=T.groups.slice(0,15).map(g=>`<tr><td>${glabel(g)}<div class="mut" style="font-size:11px">${g.n}銘柄・${g.members.slice(0,4).map(short).join(' / ')}</div></td><td class="${cls(g.r21)}">${P(g.r21)}</td><td class="${cls(g.r63)}">${P(g.r63)}</td><td>${P(g.from_high)}</td><td>${g.leaders}${badge(g)}</td></tr>`).join('');
  $('#theme').innerHTML=`
  <div class="card"><h2>テーマ判定（3条件）<span>細かいテーマ＋連動群</span></h2>
    <details class="x"><summary>読み方</summary><div>米国版と同じ3条件。①着火＝等ウェイト指数が52週高値の3%以内かつ3か月+30%以上、②広がり＝RS85以上かつ200日線上の主導株3銘柄以上、③過熱でない＝200日線から+150%以内。監視＝3か月+20%以上・高値から10%以内・主導株3以上。連動群は5銘柄以上のものだけ表示（4銘柄の群は偶然の連動が混じりやすい）。<br>検証（2018〜2026年・月末・120日後）：連動群で合格したグループの銘柄は大化け率10.5%（平常5%）、平均+7.7%（市場+4.2%）。ただし市場を上回ったのは49%で、当たり外れは大きい。</div></details>
    ${gateHtml}</div>
  <div class="card"><h2>先導株候補<span>${T.cands.length}銘柄</span></h2>
    <details class="x"><summary>読み方</summary><div>6か月リターン上位20%・52週高値の90%以上で、かつ「3か月の強さが上位30%の連動群」に入っている銘柄。検証（2018〜2026年・120日後）：大化け8.5%・大負け4.4%・市場比+5.2%（前半+1.9%・後半+6.9%）。同じ強さでも連動する仲間がいない銘柄は大負け8.6%・市場比−2.3%。33業種で絞った場合は市場比+2.3%。売買ルールではなく候補のふるい。</div></details>
    <div class="wrap"><table><tr><th>銘柄</th><th>RS</th><th>高値比</th><th>6か月</th></tr>${cands||'<tr><td colspan="4" class="empty">なし</td></tr>'}</table></div>
    ${lone?`<div class="sec">強いが連動する仲間がいない（注意）<small>${T.lone.length}銘柄</small></div><div class="m" style="font-size:12px">${lone}</div>`:''}
  </div>
  <div class="card"><h2>テーマ・ローテーション<span>3か月順・${T.themes.length}テーマ</span></h2>
    <details class="x"><summary>読み方</summary><div>手作りの細かいテーマ（Yahooの細分類・事業内容のキーワード・代表銘柄で所属を決定、1銘柄が複数テーマに入ることあり）。順位の矢印は1か月前の3か月リターン順位からの変化。主導株＝RS85以上かつ200日線上。テーマの所属は現在の事業内容で決めているので、過去の検証には使っていない（後知恵になるため）。</div></details>
    <div class="wrap"><table class="tight"><tr><th>テーマ</th><th>順位</th><th>1か月</th><th>3か月</th><th>高値から</th><th>主導</th></tr>${rot}</table></div></div>
  <div class="card"><h2>連動群（自動検出）<span>上位15・全${T.groups.length}群</span></h2>
    <details class="x"><summary>読み方</summary><div>直近120日の値動き（市場の動きを除いた分）が似ている銘柄を自動でまとめたもの。名前のないテーマや、業種をまたぐ物色の塊を見つけるため。テーマ名は所属銘柄の4割以上が同じテーマのときだけ付ける。設定（直近120日・まとめ方0.75・1群30銘柄まで）は18通りの比較で決めた：どの設定でも上位群の先導株は市場を上回り（120日で+3.4〜+6.5%）、この設定が前半・後半とも安定（+1.8%／+6.8%）。</div></details>
    <div class="wrap"><table class="tight"><tr><th>連動群</th><th>1か月</th><th>3か月</th><th>高値から</th><th>主導</th></tr>${grp}</table></div></div>`;
}

function sarLabel(r){
  if(r.sar_up==null)return '';
  if(!r.sar_up)return '<span class="chip r">週足SARベア</span>';
  const a=r.sar_age;
  if(a==null||a>=9)return `<span class="chip">週足SAR ${a??'9+'}週目・鮮度切れ</span>`;
  if(a<=1)return `<span class="chip">週足SAR ${a===0?'転換週':'1週目・様子見'}</span>`;
  return `<span class="chip g">週足SAR ${a}週目${a<=5?'・旬':''}</span>`;
}
function card(r,kind){
  const pos=r.inside&&r.pos!=null?`HL→ライン ${Math.round(r.pos*100)}%`:(r.pivot_line?'ライン上':'構造なし');
  const extra=kind==='late'?`<span class="chip">${r.signal_date}のシグナル・そこから ${P(r.from_signal)}</span>`:'';
  const miss=r.missing?r.missing.map(m=>`<span class="chip r">${esc(m)}</span>`).join(''):'';
  return `<div class="row ${kind}"><div class="h"><span>${nm(r.t)}</span><span>${Y(r.close)}</span></div>
  <div class="m">${sub(r.t)}・ランク ${r.tier}・RS189 ${r.rs189}・RS63 ${r.rs63??'—'}・売買代金 上位${100-r.dv}%・連続 ${r.streak??'—'}日</div>
  <div>${sarLabel(r)}<span class="chip">${pos}</span><span class="chip">UD比 ${r.udvr??'—'}</span>${extra}${miss}</div>
  <div class="m">損切り ${Y(r.stop)}（−8%）・買い増し ${Y(r.add)} / ${Y(r.add2)}・21EMA安値 ${Y(r.el21)}</div></div>`;
}
function renderSwing(){
  const W=D.swing, on=D.regime.on;
  const best=W.core.filter(r=>r.buyable&&on), wait=W.core.filter(r=>!r.buyable||!on);
  const late=W.late.filter(r=>r.buyable&&on);
  const sec=(t,n,s)=>`<div class="sec">${t}<small>${n}件</small></div>${s}`;
  $('#swing').innerHTML=`
  <div class="card"><h2>スイング候補<span>流動性ユニバース ${W.universe}銘柄・選定 ${W.selected}</span></h2>
    <div class="bar off"><b>検証NG・参考表示のみ</b>　米国ルールのままだと日本株では優位性なし（2018年1月〜2026年11月：年率+0.3%・最大DD−33.5%、TOPIX連動ETF保有は+11.1%・−32.7%）。売買には使わない</div>
    ${on?'<div class="bar on">地合いOK</div>':'<div class="bar off"><b>地合い：新規停止</b></div>'}
    <details class="x"><summary>読み方</summary><div>米国版の新ルールをそのまま移植。選定＝トレンドテンプレート・50日平均売買代金が上位5%・189日リターンが上位10%（株価${D.params.min_price}円以上かつ50日平均売買代金${D.params.min_dv/1e8}億円以上の中で）。タイミング＝値幅収縮（10日/50日≦0.9）・出来高減（5日/50日≦0.9）・当日+3%未満・前日+3%以下・UD比1.4未満。本命＝それに加えて週足SARが上向きで、HL→ラインの下半分にいないもの。<b>日本株での検証はまだ</b>なので、閾値（円建ての流動性条件を含む）は仮置き。</div></details>
    ${sec('本命',best.length,best.map(r=>card(r,'')).join('')||'<div class="empty">本日の本命なし</div>')}
    ${sec('まだ入れる',late.length,late.map(r=>card(r,'late')).join('')||'<div class="empty">なし</div>')}
    ${wait.length?sec('条件はそろったが買わない',wait.length,wait.map(r=>card(r,'wait')).join('')):''}
    ${sec('次の候補',W.watch_total,W.watch.map(r=>card(r,'w')).join('')||'<div class="empty">なし</div>')}
  </div>
  ${(()=>{const H=D.swing_hist,C=((D.pulse||{}).stats||{}).swing_count||{};if(!H)return '';
    const n=H.selected.length,avg=a=>a.reduce((x,y)=>x+y,0)/a.length;
    const s20=H.selected.slice(-20),sigDays=H.signal.filter(x=>x>0).length;
    return `<div class="card"><h2>候補数の推移とTOPIX<span>直近${n}日</span></h2>
    <details class="x"><summary>読み方</summary><div>選定条件を満たした銘柄数（本命・まだ入れる・次の候補の合計の母集団）と、タイミング条件までそろった数（本命相当）。${esc(C.period||'')}の検証：選定数の平均${C.avg_selected??'—'}・最大${C.max_selected??'—'}、ゼロの日${C.zero_days_pct??'—'}%。本命相当が1つ以上出た日は${C.signal_days_pct??'—'}%。選定数はTOPIX連動ETFの過去3か月の動きと連動する（相関${C.corr_past63??'—'}）が、その後3か月とはほぼ無関係（相関${C.corr_next63??'—'}）。選定ゼロの日のその後60日のTOPIX連動ETFは平均${P((C.zero_next60||{}).avg)}・上昇${R((C.zero_next60||{}).win)}で、候補が少ないことは下落の合図にならなかった。</div></details>
    <div class="grid">
      <div class="kpi"><span>選定数（今日）</span><b>${H.selected[n-1]}</b><i class="mut">直近20日の平均 ${avg(s20).toFixed(1)}・250日平均 ${avg(H.selected).toFixed(1)}</i></div>
      <div class="kpi"><span>本命相当（今日）</span><b>${H.signal[n-1]}</b><i class="mut">直近${n}日で出た日 ${sigDays}日</i></div>
      <div class="kpi"><span>流動性ユニバース</span><b>${H.universe[n-1]}</b><i class="mut">株価200円・売買代金5億円以上</i></div>
    </div>
    <div class="sec">選定数</div>${line([H.selected],{dates:H.dates,refLabel:'',fmt:v=>v,colors:['#23824d']})}
    <div class="sec">TOPIX連動ETF</div>${line([H.topix],{dates:H.dates,refLabel:'',fmt:Y})}
  </div>`})()}`;
}
function renderLead(){
  const L=D.rs_leaders;
  $('#lead').innerHTML=`<div class="card"><h2>RSリーダー<span>TT8条件通過・売買代金1億円以上</span></h2>
  <details class="x"><summary>読み方</summary><div>トレンドテンプレート8条件をすべて満たす銘柄をRS（全銘柄内の順位、1〜99）順に最大40件。</div></details>
  <div class="wrap"><table><tr><th>銘柄</th><th>RS</th><th>終値</th><th>高値から</th><th>代金(億)</th></tr>
  ${L.map(r=>`<tr><td>${nm(r.t)}<div class="mut" style="font-size:11px">${sub(r.t)}</div></td><td>${r.rs}</td><td>${Y(r.close)}</td><td>${P(r.from_high)}</td><td>${r.dv50}</td></tr>`).join('')}
  </table></div></div>`;
}
fetch('data.json',{cache:'no-store'}).then(r=>r.json()).then(d=>{
  D=d;$('#asof').textContent=d.session+' 引け';
  renderMkt();renderTheme();renderSec();renderSwing();renderLead();
  let t=location.hash.slice(1);
  try{t=t||localStorage.getItem('jpTab')}catch(e){}
  if(t)document.querySelector(`#nav button[data-t="${t}"]`)?.click();
}).catch(e=>{$('#asof').textContent='データ読み込み失敗'});
</script>
</body>
